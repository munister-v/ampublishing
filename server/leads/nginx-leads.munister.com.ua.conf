# AM Publishing Inbox — public HTTPS gateway
#
# 1. Create an A record: leads.munister.com.ua -> 173.242.49.73
# 2. Copy this file to /etc/nginx/sites-available/leads.munister.com.ua
# 3. Enable it, run certbot, then reload nginx.
#
# The Flask service remains private on 127.0.0.1:5062. No token or database is
# exposed by this configuration; the application checks X-Admin-Token itself.

server {
    listen 80;
    listen [::]:80;
    server_name leads.munister.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leads.munister.com.ua;

    ssl_certificate /etc/letsencrypt/live/leads.munister.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leads.munister.com.ua/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 128k;

    location = /health {
        proxy_pass http://127.0.0.1:5062/leads/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5062/leads/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
